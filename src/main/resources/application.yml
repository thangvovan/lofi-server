lofi:
  ffmpeg: ffmpeg
  default-bitrate: 32
  allowed-bitrates: 32, 48, 64, 96
  resolve-ttl-seconds: 1800
  cluster-millis: 1000
  idle-grace-seconds: 30
  subscriber-queue-size: 64

server:
  port: ${PORT:80}

spring:
  application:
    name: lofi-server
  mvc:
    async:
      request-timeout: -1
  threads:
    virtual:
      enabled: true

logging:
  level:
    root: INFO
  pattern:
    console: "[lofi] %d{HH:mm:ss}  %-5level %logger{0} - %msg%n"
