# Deploys the server to the Oracle Cloud VM on every push to main.
#
# This is the part Render did by itself. The build runs here rather than on the
# VM, but only as a check - the VM rebuilds its own image, because shipping a
# 20 MB jar over SSH on every push is slower than letting Docker reuse its layer
# cache on the far end.
#
# Secrets to set in the repository (Settings -> Secrets -> Actions):
#   SSH_HOST  the VM's public IP
#   SSH_USER  ubuntu on an Ubuntu image, opc on Oracle Linux
#   SSH_KEY   the private key whose public half is in the VM's authorized_keys

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      # Catches a broken build here instead of on the VM, where a failed rebuild
      # would leave the old container running and the failure unnoticed.
      - run: mvn -B -q package -DskipTests

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add the VM to known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy the server sources
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519" \
            --exclude target --exclude .git --exclude .github \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/lofi/"

      - name: Rebuild and restart
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'cd ~/lofi && docker compose up -d --build && docker image prune -f'

      - name: Check it came back
        run: |
          # The container needs a moment to boot before it answers; failing here
          # is the signal that a deploy broke something, so it must not be skipped.
          sleep 25
          curl -fsS --max-time 10 \
            "http://${{ secrets.SSH_HOST }}:8477/api/health"
